# Machine-readable form of docs/ARCHITECTURE_INVARIANTS.md.
#
# Every enforcement point is `module:qualname` and must resolve to a real
# symbol; every test is `path::function` and must exist; every mutant must be
# defined in tests/integrity_mutations.py and still apply; every finding must
# map to an invariant and a reproduction, and where its frozen evidence is on
# this machine its bytes must hash to what is recorded here. The prose
# document is the explanation; this file is what
# tests/test_architecture_invariants.py holds to account, so a rename that
# orphans an invariant fails the suite.
#
# It is traceability metadata, not proof. That a test is listed says where a
# property is demonstrated; whether it is demonstrated is the test's job, and
# whether the tests bite is the mutation harness's.
schema: research-os-architecture-invariants-v2
spec: docs/ARCHITECTURE_INVARIANTS.md
