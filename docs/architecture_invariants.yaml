      - tests/test_integrity_v2_replication_provenance.py::test_a_replication_of_a_primary_with_no_receipt_is_refused_before_it_runs
      - tests/test_integrity_v2_budget_caps.py::test_the_router_refuses_an_adapter_that_cannot_be_capped
    mutants: [MUT-H6-1]
    pass_requires: >-
      the existing refusal tests passing; a replication with no attested
      perturbation recorded INSUFFICIENT with its reason; a replication of a
      primary with no trusted receipt refused before it runs; an uncappable
      provider a capability refusal, never spend

  - id: INV-10
    title: Human authority
