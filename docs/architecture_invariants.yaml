      - tests/test_portfolio_empirical.py::test_a_host_with_no_executor_refuses_rather_than_reasoning_about_the_result
      - tests/test_portfolio_empirical.py::test_a_host_that_cannot_contain_refuses_rather_than_running_uncontained
      - tests/test_portfolio_scientific_contract.py::test_an_undeclared_capability_is_refused_and_the_contract_is_kept
      - tests/test_runtime_actions.py::test_an_untestable_hypothesis_is_a_valid_answer
