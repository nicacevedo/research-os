      - tests/test_integrity_v2_replication_provenance.py::test_an_attestation_naming_nothing_declared_is_refused_at_declaration
    mutants: [MUT-H6-1, MUT-H6-2, MUT-H6-3, MUT-H6-4]
    pass_requires: >-
      configuration independence only from two runner-written receipts that
      show the frozen variation delivered to a separate execution;
      perturbation validity only from the researcher's attestation frozen in
      the manifest, recorded as attested and never as proved; agreement
      recorded separately; an ignored-seed rerun is not a replication without
      an attestation, and with one is recorded as exactly that

  - id: INV-08
    title: Evidence completeness, read by the gates themselves
    threat: >-
      a mandatory failure masked by another stage's success, or readiness
      inferred from a row existing rather than from the trusted objects behind it
    findings: [M2, H1, R3, R4, R5]
    enforced_by:
      - research_os.portfolio.track:_accumulate
      - research_os.portfolio.track:finish_board
      - research_os.portfolio.runner:finish_review_board
      - research_os.portfolio.runner:_evaluate
      - research_os.portfolio.stages:board_state
      - research_os.portfolio.store:PortfolioStore.live_reviews
      - research_os.portfolio.gates:_promising_unmet
      - research_os.portfolio.gates:_validated_unmet
      - research_os.portfolio.gates:_human_ready_unmet
      - research_os.portfolio.gates:_incomplete_review_events
      - research_os.portfolio.gates:_replication_met
      - research_os.portfolio.gates:evaluate
      - research_os.portfolio.gates:permit
    tests:
      - tests/test_integrity_review_events.py::test_a_board_missing_any_reviewer_is_not_complete_and_says_which
      - tests/test_integrity_review_events.py::test_a_reviewer_answering_with_a_superseded_prompt_does_not_complete_it
      - tests/test_integrity_review_events.py::test_one_endorsement_does_not_mask_another_reading_of_the_same_role
      - tests/test_integrity_reproductions.py::test_m2_a_board_missing_a_reviewer_is_not_a_completed_board
      - tests/test_integrity_v2_review_events.py::test_a_legacy_review_whose_objections_may_be_incomplete_is_never_live
      - tests/test_integrity_v2_review_events.py::test_the_gate_itself_refuses_a_live_review_missing_its_objection
      - tests/test_integrity_v2_review_events.py::test_a_review_from_a_superseded_prompt_is_not_live_and_its_objection_stands
      - tests/test_integrity_v2_review_events.py::test_a_stale_review_stops_counting_and_its_fatal_objection_still_blocks
      - tests/test_portfolio_gates.py::test_an_executed_replication_row_without_a_trusted_chain_is_not_verification
      - tests/test_integrity_v2_migrations.py::test_upgraded_0036_replication_evidence_cannot_satisfy_the_current_gate
    mutants: [MUT-M2-1, MUT-M2-2, MUT-M2-3, MUT-R2-1, MUT-R2-2, MUT-V3-3, MUT-V3-4]
    pass_requires: >-
      a board missing a reviewer is not complete and does not move the idea;
      a re-run endorsement does not mask a standing negative review; a live
      review whose objections are not all on record is not counted; the
      replication gate counts only an evidence row whose trusted chain it
      re-verifies as admissible, and legacy evidence never

