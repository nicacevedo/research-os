      - tests/test_integrity_human_authority.py::test_no_autonomous_module_lifts_the_blocks_a_person_resumes
      - tests/test_integrity_human_authority.py::test_the_scan_sees_the_human_entry_points_it_excludes
      - tests/test_integrity_human_authority.py::test_the_tick_never_resumes_a_researchers_pause
      - tests/test_runtime_authority.py::test_no_runtime_module_promotes_a_proposal
      - tests/test_portfolio_authority.py::test_no_portfolio_module_promotes_anything
      - tests/test_integrity_budget_parks.py::test_raising_the_idea_ceiling_resumes_the_idea_as_it_was
      - tests/test_integrity_budget_parks.py::test_raising_the_lineage_ceiling_resumes_a_lineage_parked_idea
      - tests/test_integrity_budget_parks.py::test_a_ceiling_raised_too_little_revives_nothing
      - tests/test_integrity_budget_parks.py::test_an_idea_also_blocked_by_the_novelty_floor_stays_parked
      - tests/test_integrity_budget_parks.py::test_a_park_for_any_other_reason_is_not_revived_by_a_ceiling
      - tests/test_integrity_budget_parks.py::test_a_park_reason_does_not_outlive_its_park
      - tests/test_integrity_reproductions.py::test_m4_raising_the_ceiling_the_record_names_revisits_the_idea
      - tests/test_integrity_v2_parks_and_races.py::test_a_legacy_park_is_revived_by_no_ceiling_and_says_a_person_decides
      - tests/test_integrity_v2_parks_and_races.py::test_model_prose_naming_a_lineage_room_status_revives_nothing
      - tests/test_integrity_v2_parks_and_races.py::test_a_structural_lineage_room_park_still_resumes_at_its_recorded_status
      - tests/test_integrity_v2_migrations.py::test_legacy_state_fails_closed_after_upgrading_to_the_head
    mutants: [MUT-M4-1, MUT-M4-2, MUT-M4-3, MUT-INV10-1]
    pass_requires: >-
      the authority suites passing; a budget park revived only by a ceiling a
      person raised; a legacy park with no structural reason revived by
      nothing autonomous and shown as a person's decision; no revival read
      from model-writable prose

