[project]
name = "research-os"
version = "1.0.0"
description = "Local-first orchestration for reproducible, evidence-grounded scientific research."
readme = "README.md"
authors = [
    { name = "Nicolás Acevedo Villena", email = "ni.acevedo.villena@gmail.com" }
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.13.5",
    "pyyaml>=6.0.3",
]

[project.scripts]
researchctl = "research_os.cli:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
src = ["src", "tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.6",
]
